<style>
/* BODY */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  /* Background image with overlay for better contrast */
  background: 
    linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
    url("smart-home-bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: white;
  scroll-behavior: smooth;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 600;
}

.logo img {
  height: 30px;
}

/* NAV */
nav {
  display: flex;
  gap: 15px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
}

nav a:hover {
  color: cyan;
}

.menu-toggle {
  display: none;
  font-size: 24px;
  cursor: pointer;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  /* Keep background overlay for hero for contrast */
  background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
    url("smart-home-bg.jpg");
  background-size: cover;
  background-position: center;
}

.hero h1 {
  font-size: 28px;
  line-height: 1.4;
  margin: 0 0 15px;
  text-shadow: 0 0 10px cyan, 0 0 20px cyan, 0 0 40px cyan;
}

.hero p {
  font-size: 14px;
  color: #ccc;
}

/* SERVICES */
.services {
  padding: 60px 20px;
  text-align: center;
}

.services h2 {
  font-size: 24px;
  margin-bottom: 30px;
}

.service-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.card {
  background: rgba(255, 255, 255, 0.05);
  padding: 20px;
  border-radius: 10px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.02);
  box-shadow: 0 0 15px cyan;
}

.card h3 {
  color: cyan;
  font-size: 18px;
  margin-bottom: 10px;
}

/* PROJECTS */
.video-section {
  padding: 60px 20px;
  text-align: center;
}

.video-section h2 {
  font-size: 24px;
  margin-bottom: 20px;
}

.video-container {
  max-width: 100%;
  margin: auto;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 20px cyan;
}

video {
  width: 100%;
  height: auto;
  display: block;
}

/* CONTACT */
.contact {
  padding: 60px 20px;
  text-align: center;
}

.contact h2 {
  font-size: 24px;
  margin-bottom: 20px;
}

.contact input,
.contact textarea {
  width: 100%;
  max-width: 400px;
  margin: 10px auto;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
}

.contact button {
  padding: 12px 30px;
  background: cyan;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 15px;
  font-size: 14px;
}

/* WHATSAPP FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  font-size: 24px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
  box-shadow: 0 0 10px #25D366;
}

/* FOOTER */
footer {
  background: black;
  text-align: center;
  padding: 15px;
  font-size: 14px;
  color: #aaa;
}

/* MOBILE STYLES */
@media(max-width: 768px) {
  header {
    padding: 10px 15px;
  }

  nav {
    display: none;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.95);
    position: absolute;
    top: 50px;
    right: 15px;
    width: 180px;
    padding: 10px 15px;
    border-radius: 8px;
  }

  nav.show {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }

  nav a {
    display: block;
    margin: 10px 0;
    font-size: 14px;
  }

  /* Adjust hero font size for small screens */
  .hero h1 {
    font-size: 20px;
  }

  /* Slightly reduce padding and font sizes for smaller screens */
  .service-grid {
    grid-template-columns: 1fr;
  }

  .card h3 {
    font-size: 16px;
  }

  .contact input,
  .contact textarea {
    font-size: 14px;
  }

  .contact button {
    font-size: 14px;
  }
}
</style>
